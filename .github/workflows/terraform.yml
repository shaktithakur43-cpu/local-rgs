name: "Terraform Security Pipeline"

on: 
  push: 
    branches: 
      - main 
  pull_request:
    branches:
      - main

permissions: 
  contents: read 
  id-token: write 
  issues: write 
  pull-requests: write

jobs: 
  TruffleHog: 
    runs-on: ubuntu-latest 
    defaults: 
      run: 
        shell: bash 

    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
        with: 
          fetch-depth: 0
          # 3. tfsec Step
      - name: Run tfsec (Security Scan)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: .

      # 4. Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -backend=false

      # 5. TFLint Step
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Run TFLint
        run: |
          tflint --init
          tflint -f compact