name: "Terraform Security Pipeline"

on: 
  push: 
    branches: 
      - main 
  pull_request:
    branches:
      - main

permissions: 
  contents: read 
  id-token: write 
  issues: write 
  pull-requests: write

jobs: 
  TruffleHog: 
    runs-on: ubuntu-latest 
    defaults: 
      run: 
        shell: bash 

    steps: 
      - name: Checkout code 
        uses: actions/checkout@v4 
        with: 
          fetch-depth: 0